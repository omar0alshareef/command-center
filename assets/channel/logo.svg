<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-label="أصحاب الحرف">
  <!-- YouTube avatar is cropped to a circle: keep everything inside r=300 -->
  <rect width="800" height="800" fill="#1F4E4A"/>
  <circle cx="400" cy="400" r="330" fill="none" stroke="#C8553D" stroke-width="14"/>
  <!-- Fonts: Cairo (Google Fonts, SIL OFL, free). Fallback Tahoma/Arial for viewers without it. -->
  <text x="400" y="505" text-anchor="middle" font-family="Cairo, Tajawal, Tahoma, Arial, sans-serif" font-weight="800" font-size="400" fill="#F6EFE4">ح</text>
  <rect x="300" y="560" width="200" height="12" rx="6" fill="#C8553D"/>
</svg>
