<!doctype html><html lang="en"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1600px;background:#EFE8D7;font-family:Inter,system-ui,sans-serif;color:#252E1B;padding:48px 56px}
h1{font-family:Lora,Georgia,serif;font-weight:500;font-size:44px;margin-bottom:8px}
p.sub{color:#6B6F55;font-size:20px;margin-bottom:32px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:28px}
figure{background:#FAF6EA;border-radius:16px;overflow:hidden}
figure img{width:100%;display:block}
figcaption{padding:14px 20px;font-size:20px;color:#252E1B}
figcaption span{color:#6B6F55}
</style></head><body>
<h1>Themes: four looks, pick in Settings</h1>
<p class="sub">Same board, four themes: Dark, Light, Calm, Calm Dark. Set under Settings → Theme, or cycle with the Toggle theme command.</p>
<div class="grid">
<figure><img src="../app/theme-dark-swim-lane.png"><figcaption>Dark <span>· default</span></figcaption></figure>
<figure><img src="../app/theme-light-swim-lane.png"><figcaption>Light</figcaption></figure>
<figure><img src="../app/theme-calm-swim-lane.png"><figcaption>Calm <span>· beige, warm</span></figcaption></figure>
<figure><img src="../app/theme-calm-dark-swim-lane.png"><figcaption>Calm Dark</figcaption></figure>
</div></body></html>
