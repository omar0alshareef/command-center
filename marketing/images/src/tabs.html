<!doctype html><html lang="en"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1600px;background:#EFE8D7;font-family:Inter,system-ui,sans-serif;color:#252E1B;padding:48px 56px}
h1{font-family:Lora,Georgia,serif;font-weight:500;font-size:44px;margin-bottom:8px}
p.sub{color:#6B6F55;font-size:20px;margin-bottom:32px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:28px}
figure{background:#FAF6EA;border-radius:16px;overflow:hidden}
figure img{width:100%;display:block}
figcaption{padding:14px 20px;font-size:20px}
figcaption span{color:#6B6F55}
</style></head><body>
<h1>Seven tabs, one board</h1>
<p class="sub">Each tab reads the same project data. Click a tab to switch.</p>
<div class="grid">
<figure><img src="../app/tab-1-swim-lane.png"><figcaption>Swim Lane <span>· milestones on a timeline, grouped by domain</span></figcaption></figure>
<figure><img src="../app/tab-2-task-board.png"><figcaption>Task Board <span>· To do, In progress, Review, Done, Blocked</span></figcaption></figure>
<figure><img src="../app/tab-3-agent-hub.png"><figcaption>Agent Hub <span>· agents, their status and runs</span></figcaption></figure>
<figure><img src="../app/tab-4-calendar.png"><figcaption>Calendar <span>· tasks by day</span></figcaption></figure>
<figure><img src="../app/tab-5-terminal.png"><figcaption>Terminal <span>· a shell inside the project</span></figcaption></figure>
<figure><img src="../app/tab-6-planning.png"><figcaption>Planning <span>· draft and approve the plan</span></figcaption></figure>
<figure><img src="../app/tab-7-agents.png"><figcaption>Agents <span>· the agent library</span></figcaption></figure>
</div></body></html>
